services:
  # 1. Spring Boot Backend Web Service (Java 21)
  - type: web
    name: careerconnect-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: dev
      - key: PORT
        value: "10000"
      - key: JWT_SECRET
        value: careerconnect_super_secret_jwt_key_that_is_at_least_256_bits_long_for_security_compliance_2026!
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

  # 2. React Vite Frontend Static Site (React 18 + Tailwind)
  - type: web
    name: careerconnect-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://careerconnect-backend-im49.onrender.com/api
    routes:
      - type: rewrite
        source: /api/*
        destination: https://careerconnect-backend-im49.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
